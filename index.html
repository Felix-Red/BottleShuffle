<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Bottle Shuffle</title>
    <!--
      YouTube Playables SDK integration point (future task):
      The official YouTube Playables SDK script must be loaded here before
      game scripts execute when YouTube Playables integration is enabled.
    -->
    <style>
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 600 700;
        font-display: swap;
        src: url('/assets/fonts/fredoka/fredoka-latin-ext.woff2') format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 600 700;
        font-display: swap;
        src: url('/assets/fonts/fredoka/fredoka-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/assets/fonts/nunito/nunito-latin-ext.woff2') format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113,
          U+2C60-2C7F, U+A720-A7FF;
      }

      @font-face {
        font-family: 'Nunito';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/assets/fonts/nunito/nunito-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #171126;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      #game-container {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #game-container canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container" role="application" aria-label="Bottle Shuffle game canvas"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
